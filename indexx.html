<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 简易小游戏</title>
    <style>
        body { margin: 0; } /* 清除默认边距 */
        canvas { display: block; } /* 让画布占满屏幕 */
        #score { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; }
    </style>
</head>
<body>
    <div id="score">分数: 0</div>
    <!-- 引入Three.js核心库（CDN） -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
        // 1. 初始化Three.js核心组件（场景、相机、渲染器）
const scene = new THREE.Scene(); // 游戏场景（存放所有游戏对象）
scene.background = new THREE.Color(0x111111); // 场景背景色（深灰）

// 透视相机（模拟人眼视角，参数：视野角度、宽高比、近裁剪面、远裁剪面）
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 5; // 相机位置（z轴方向远离原点）

// 渲染器（将场景渲染到页面）
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight); // 设置渲染器尺寸（全屏）
document.body.appendChild(renderer.domElement); // 将渲染器的画布添加到页面

// 2. 创建游戏对象
// 玩家（立方体）
const playerGeometry = new THREE.BoxGeometry(1, 1, 1); // 立方体几何形状（长宽高1）
const playerMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 }); // 绿色材质
const player = new THREE.Mesh(playerGeometry, playerMaterial);
player.position.set(0, 0, 0); // 玩家初始位置
scene.add(player); // 将玩家添加到场景

// 目标物体（球体，收集物）
const targetGeometry = new THREE.SphereGeometry(0.5, 32, 32); // 球体几何（半径0.5）
const targetMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 }); // 红色材质
const target = new THREE.Mesh(targetGeometry, targetMaterial);
// 随机生成目标位置（x轴范围-4~4，y轴0，z轴0）
target.position.set(Math.random() * 8 - 4, 0, 0);
scene.add(target);

// 3. 游戏状态管理
let score = 0;
const scoreElement = document.getElementById('score');
const playerSpeed = 0.1; // 玩家移动速度

// 4. 键盘交互（监听按键控制玩家移动）
const keys = {}; // 存储按下的按键
document.addEventListener('keydown', (e) => {
    keys[e.key] = true;
});
document.addEventListener('keyup', (e) => {
    keys[e.key] = false;
});

// 5. 碰撞检测（判断玩家是否碰到目标）
function checkCollision() {
    // 计算玩家和目标的距离（Three.js内置方法）
    const distance = player.position.distanceTo(target.position);
    // 碰撞条件：距离小于两者半径之和（立方体边长1，半径≈0.5；球体半径0.5，总和1）
    if (distance < 1) {
        score++; // 分数+1
        scoreElement.textContent = `分数: ${score}`;
        // 目标随机刷新位置
        target.position.set(Math.random() * 8 - 4, 0, 0);
    }
}

// 6. 游戏循环（核心：持续更新游戏状态+渲染场景）
function gameLoop() {
    requestAnimationFrame(gameLoop); // 浏览器刷新率同步（约60次/秒）

    // 更新玩家位置（根据按键）
    if (keys['ArrowLeft'] || keys['a']) {
        player.position.x -= playerSpeed;
    }
    if (keys['ArrowRight'] || keys['d']) {
        player.position.x += playerSpeed;
    }
    if (keys['ArrowUp'] || keys['w']) {
        player.position.y += playerSpeed;
    }
    if (keys['ArrowDown'] || keys['s']) {
        player.position.y -= playerSpeed;
    }

    // 边界限制（防止玩家移出屏幕）
    player.position.x = Math.max(-4, Math.min(4, player.position.x));
    player.position.y = Math.max(-4, Math.min(4, player.position.y));

    // 检测碰撞
    checkCollision();

    // 渲染场景（相机视角下的场景）
    renderer.render(scene, camera);
}

// 7. 窗口自适应（调整窗口大小时更新相机和渲染器）
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// 启动游戏循环
gameLoop();
    </script>
</body>
</html>
